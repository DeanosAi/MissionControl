services:
  postgres:
    image: postgres:17-bookworm
    container_name: mission-control-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mission_control}
      POSTGRES_USER: ${POSTGRES_USER:-mission_control}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mission-control-vps:
    build: .
    container_name: mission-control-vps
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      one-leaderboard:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://mission_control:change-me@postgres:5432/mission_control}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      PROVIDER_CREDENTIALS_KEY: ${PROVIDER_CREDENTIALS_KEY}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      OPENAI_OAUTH_ENDPOINT: ${OPENAI_OAUTH_ENDPOINT}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      N8N_API_URL: ${N8N_API_URL}
      N8N_API_KEY: ${N8N_API_KEY}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      AUTOMATION_TICK_TOKEN: ${AUTOMATION_TICK_TOKEN}
      RESEARCH_SOURCE_URLS: ${RESEARCH_SOURCE_URLS}

  one-leaderboard:
    build:
      context: https://github.com/DeanosAi/one-by-mingara-leaderboard.git#022839343f6fc95cb18d1146f15033d0e1c1f199
    container_name: one-leaderboard
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4173
      ADMIN_PASSWORD: ${LEADERBOARD_ADMIN_PASSWORD:?Set LEADERBOARD_ADMIN_PASSWORD in .env}
    expose:
      - "4173"
    volumes:
      - one-leaderboard-data:/app/data

volumes:
  postgres-data:
  one-leaderboard-data:
